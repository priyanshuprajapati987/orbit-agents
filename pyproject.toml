[project]
name = "orbit-agents"
version = "3.7.0"
description = "ORBIT Multi-Agent Framework - Queen/Council/Planner/Executor orchestration with 25 specialist agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Elastic-2.0" }
authors = [{ name = "Priyanshu Prajapati" }]
keywords = ["multi-agent", "ai", "llm", "orchestrator"]
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "pillow>=9.0",
    "cryptography>=41.0",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/priyanshuprajapati987/orbit-agents"
Issues = "https://github.com/priyanshuprajapati987/orbit-agents/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbit*"]
